name: github-pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure site brand + data present
        run: |
          mkdir -p site/brand site/data
          cp -n assets/brand/*.svg site/brand/ 2>/dev/null || cp assets/brand/*.svg site/brand/
          test -f evaluation/BENCHMARKS.json && cp evaluation/BENCHMARKS.json site/data/benchmarks.json || true
          test -f benchmarks/results/perf_gates.json && cp benchmarks/results/perf_gates.json site/data/perf_gates.json || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
