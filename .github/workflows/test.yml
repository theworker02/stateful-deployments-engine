name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Verify modules
        run: go mod verify && go mod tidy && git diff --exit-code go.mod go.sum
      - name: Build
        run: go build -o sde ./cmd/sde
      - name: Test
        run: go test ./...
      - name: Version
        run: ./sde version
